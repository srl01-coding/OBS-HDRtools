Color.Zones="Tonal zones"
Color.Zones.Info="Ranges are in stops from the gray reference (Advanced). Masks are measured after white balance and global exposure and then frozen, so a zone adjustment never moves a pixel into another zone; global exposure moves the picture under the zones. Overlapping zones add (EV) or multiply (saturation). Saturation acts after the wheels, so desaturating a zone also removes its wheel colour. Tonal order: keep a push within about falloff / 1.5 EV on the side it pushes against (2-stop falloff: +-1.3 EV); beyond that, tones inside the falloff can cross over (brighter input ending up darker). Widen the falloff for bigger pushes."
