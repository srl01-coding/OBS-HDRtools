Denoise.Name="HDR Program Denoise"
Denoise.Menu="HDR Program Denoise..."
Denoise.Info="Processes the finished program picture once per frame, after scene switching and transitions, before streaming, recording and the Program monitor. Preview and multiview do not run it. Works in OBS's HDR working space: no decode, no clamp. Development build P2: HQDN3D-style spatial (symmetric kernel) + temporal denoise (an independent implementation, not FFmpeg's code); Identity is the transparency test; Compute identity is the D3D11 compute spike (Windows, HDR canvas)."
