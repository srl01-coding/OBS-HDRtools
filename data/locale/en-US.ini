DenoiseFilter.Name="HDR Denoise"
DenoiseFilter.Measure.Group="Noise measurement (sets the noise floor / comparison knee)"
DenoiseFilter.Measure.Info="Point the camera at a static scene with dark and bright areas (no people moving, auto exposure and auto ISO off, the lighting you will use), then press Measure. It samples 60 frames of this filter's input (about 2 s) and writes a table to the OBS log. Measure again whenever the camera gain, exposure or lighting changes."
DenoiseFilter.Measure.None="No measurement yet."
DenoiseFilter.Measure.Start="Measure noise"
DenoiseFilter.Measure.Apply="Apply measured noise floor (sets the comparison knee; noise profile to identity)"
DenoiseFilter.Info="Add to an individual camera, before HDR Color and HDR Transform. Recommended for the best temporal denoise quality: the history follows this camera only and the noise has not yet been graded, scaled or warped. Same algorithm and settings as Tools > HDR Program Denoise, which processes the final program once and is the lower-GPU option. Development build."
