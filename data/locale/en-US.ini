Color.Zones="Tonal zones"
Color.Zones.Info="Ranges are in stops from the gray reference (Advanced). Defaults: Dark, Shadow, Midtones, Light and Highlight hand over at -4 / -1 / +1 / +3 stops with mirrored fades, so their weights add up to exactly 1 (equal pushes on neighbours give an even push). Dark reaches down to black and Highlight up to peak; Black (full below -7) and Specular (full above +5) sit on top of them. Masks are measured after white balance and global exposure and then frozen, so a zone adjustment never moves a pixel into another zone; global exposure moves the picture under the zones. Overlapping zones add (EV) or multiply (saturation). Saturation acts after the wheels, so desaturating a zone also removes its wheel colour. Tonal order: keep a push within about falloff / 1.5 EV on the side it pushes against (default 1.5-stop fades: +-1 EV; Dark/Shadow 2 stops: +-1.3 EV); beyond that, tones inside the falloff can cross over (brighter input ending up darker). Widen the falloff for bigger pushes."
